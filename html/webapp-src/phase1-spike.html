<!DOCTYPE html>
<html>
<head>
	<title>Phase 1 spike — TeaVM engine-worker (no libGDX yet)</title>
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<style>
		:root { color-scheme: dark; }
		body { margin: 0; padding: 0; overflow: hidden; background: #000; color: #eee;
			font-family: system-ui, -apple-system, sans-serif; height: 100vh; }
		#canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
		#hud { position: fixed; top: 12px; left: 12px;
			background: rgba(0, 0, 0, 0.55); padding: 10px 14px; border-radius: 4px;
			font-size: 13px; line-height: 1.5; pointer-events: none; max-width: 90vw; }
		#hud b { color: #6cf; }
		#hud .ok { color: #6f6; }
		#hud .err { color: #f66; }
		#log { margin-top: 6px; color: #aaa; font-size: 11px; line-height: 1.4;
			max-height: 200px; overflow: hidden; }
	</style>
</head>
<body oncontextmenu="return false">
	<canvas id="canvas"></canvas>
	<div id="hud"><b>phase 1 spike: starting…</b><div id="log"></div></div>
	<script>
		const canvas = document.getElementById('canvas');
		const log = document.getElementById('log');
		const lines = [];
		function pushLog(s) {
			lines.push(s);
			if (lines.length > 30) lines.shift();
			log.innerHTML = lines.map(l => '· ' + l).join('<br>');
		}

		if (typeof OffscreenCanvas === 'undefined') { pushLog('FAIL: no OffscreenCanvas'); throw 0; }
		if (typeof Worker === 'undefined') { pushLog('FAIL: no Worker'); throw 0; }

		const offscreen = canvas.transferControlToOffscreen();
		// engine-worker.js is built by `:html:buildEngineWorker` (chained off
		// :html:buildWeb) and lands as a sibling of this page. TeaVM bundles
		// don't self-invoke main(), so a tiny boot script does the
		// importScripts + self.main() dance — same pattern as worker-boot.js
		// for the extraction worker.
		const worker = new Worker('engine-worker-boot.js');
		worker.onmessage = (e) => {
			const text = String(e.data);
			pushLog(text);
			// Mirror to console too — easier to right-click → copy from devtools
			// than to highlight overlapping HUD text in the canvas page.
			console.log('[worker]', text);
		};
		worker.onerror = (e) => {
			const msg = 'worker error: ' + (e.message || '(no msg)');
			pushLog(msg);
			console.error('[worker]', msg);
		};

		function postResize() {
			const dpr = window.devicePixelRatio || 1;
			worker.postMessage({
				kind: 'resize',
				pixelWidth: Math.max(1, Math.round(canvas.clientWidth * dpr)),
				pixelHeight: Math.max(1, Math.round(canvas.clientHeight * dpr)),
			});
		}

		// Render at CSS-pixel resolution (no DPR scaling). HiDPI back-buffer
		// rendering needs the engine's UI font scaled by dpr too, otherwise
		// text stays 15px while UI quads scale up — buttons huge, text tiny.
		// That font-scaling is an engine-side change we'll pick up later.
		// Until then, 1:1 keeps everything proportional.
		const dpr0 = 1;
		const cssW0 = canvas.clientWidth;
		const cssH0 = canvas.clientHeight;
		offscreen.width = Math.max(1, Math.round(cssW0));
		offscreen.height = Math.max(1, Math.round(cssH0));

		worker.postMessage({
			kind: 'init',
			canvas: offscreen,
			cssWidth: cssW0,
			cssHeight: cssH0,
			dpr: dpr0,
		}, [offscreen]);

		window.addEventListener('resize', postResize);
		// Phase 2 input proxy. Pointer / key / wheel events forwarded to the
		// worker; coordinates are CSS-pixel relative to the canvas (worker
		// scales for dpr internally). Engine-side WorkerInput queues these
		// and drains them at the start of each frame, fanning out to libGDX
		// InputProcessor callbacks.
		function relayPointer(name, e) {
			const rect = canvas.getBoundingClientRect();
			worker.postMessage({
				kind: 'pointer', name,
				x: Math.round(e.clientX - rect.left),
				y: Math.round(e.clientY - rect.top),
				button: e.button,
			});
		}
		canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); relayPointer('down', e); });
		canvas.addEventListener('pointerup', e => relayPointer('up', e));
		canvas.addEventListener('pointermove', e => relayPointer('move', e));
		canvas.addEventListener('pointercancel', e => relayPointer('up', e));
		canvas.addEventListener('wheel', e => {
			worker.postMessage({ kind: 'scroll', dx: e.deltaX, dy: e.deltaY });
			e.preventDefault();
		}, { passive: false });
		// Keys go on window since canvas can't reliably hold focus without
		// extra scaffolding (tabindex, etc).
		window.addEventListener('keydown', e => {
			worker.postMessage({ kind: 'key', name: 'down', keycode: domKeyToGdx(e), ch: e.key.length === 1 ? e.key : '' });
		});
		window.addEventListener('keyup', e => {
			worker.postMessage({ kind: 'key', name: 'up', keycode: domKeyToGdx(e), ch: '' });
		});

		// Map a DOM KeyboardEvent to libGDX Input.Keys constants. Just enough
		// for the spike — full table can come later when the engine actually
		// consumes specific keys.
		function domKeyToGdx(e) {
			// Letter keys
			if (e.code && e.code.startsWith('Key')) return 29 + (e.code.charCodeAt(3) - 65); // A=29
			if (e.code && e.code.startsWith('Digit')) return 7 + (e.code.charCodeAt(5) - 48);  // 0=7
			switch (e.code) {
				case 'Space': return 62;
				case 'Enter': return 66;
				case 'Escape': return 131;
				case 'ArrowLeft': return 21;
				case 'ArrowRight': return 22;
				case 'ArrowUp': return 19;
				case 'ArrowDown': return 20;
				case 'ShiftLeft': case 'ShiftRight': return 59;
				case 'ControlLeft': case 'ControlRight': return 129;
				case 'AltLeft': case 'AltRight': return 57;
				case 'Tab': return 61;
				case 'Backspace': return 67;
				default: return -1;
			}
		}
	</script>
</body>
</html>
