<!DOCTYPE html>
<html>
<head>
	<title>Warsmash</title>
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<style>
		:root { color-scheme: dark; }
		body {
			margin: 0; padding: 0; overflow: hidden;
			background: #000; color: #eee;
			font-family: system-ui, -apple-system, sans-serif;
			height: 100vh;
			height: 100dvh;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
		}
		#canvas-wrap {
			display: none;
			justify-content: center; align-items: center;
			width: 100vw; height: 100vh;
			height: 100dvh;
			background: #000 url('bg.png') center/cover no-repeat;
			touch-action: none;
		}
		#canvas {
			border: none;
			display: block;
			/* Cap to the engine's internal 4:3 layout. WarsmashGdxMenuScreen
			   centers a 4:3 viewport inside whatever canvas it's given; if the
			   canvas itself is 4:3 the menu fills it edge-to-edge with no
			   ugly off-center 3D backdrop. Wrap fills the viewport in black so
			   the leftover area becomes letterbox space.
			   The min() expressions compute the largest 4:3 box that fits in
			   the viewport. CSS aspect-ratio alone falls back to the canvas
			   element's tiny intrinsic 300×150 default when both dims are
			   auto, hence the explicit math. */
			width:  min(100vw, calc(100vh * 4 / 3));
			height: min(100vh, calc(100vw * 3 / 4));
			touch-action: none;
			/* Hide the OS pointer; the engine draws its own (Cursor.png from
			   the WC3 install). */
			cursor: none;
		}
		#overlay {
			position: fixed; inset: 0;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
			background: radial-gradient(ellipse at center, #1a2233 0%, #000 100%);
			gap: 18px;
		}
		#overlay h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: 0.5px; }
		#overlay p { margin: 0; max-width: 560px; text-align: center; color: #bbb; line-height: 1.5; }
		#overlay code { background: #222; padding: 2px 6px; border-radius: 3px; }
		.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
		button, label.fakebtn {
			background: #2a4a7a; color: white; border: none; padding: 10px 18px;
			border-radius: 4px; cursor: pointer; font-size: 14px;
		}
		button.secondary, label.fakebtn.secondary { background: #444; }
		button:hover, label.fakebtn:hover { filter: brightness(1.15); }
		button:disabled { opacity: 0.5; cursor: not-allowed; }
		#progress {
			display: none; width: 520px; max-width: 90vw;
			background: #222; border-radius: 4px; overflow: hidden; height: 10px;
		}
		#progress-bar { height: 100%; width: 0%; background: #4a90d9; transition: width 100ms; }
		#summary { color: #c8d8f1; font-size: 13px; text-align: center; max-width: 560px; line-height: 1.5; }
		#status { color: #999; font-size: 13px; min-height: 18px; text-align: center; max-width: 560px; }
		#error { color: #f66; font-size: 13px; text-align: center; max-width: 560px; }
		#maps-modal {
			position: fixed; inset: 0; z-index: 100;
			background: rgba(0, 0, 0, 0.75);
			display: flex; align-items: center; justify-content: center;
			padding: 24px;
		}
		.maps-panel {
			background: #1a2233; border: 1px solid #2a3a52; border-radius: 6px;
			width: 100%; max-width: 720px; max-height: 100%;
			display: flex; flex-direction: column;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
		}
		.maps-header {
			display: flex; align-items: center; justify-content: space-between;
			padding: 14px 18px; border-bottom: 1px solid #2a3a52;
		}
		.maps-title { font-size: 16px; font-weight: 500; }
		.maps-actions {
			display: flex; align-items: center; gap: 12px;
			padding: 12px 18px; border-bottom: 1px solid #2a3a52;
		}
		#maps-info { color: #99a8c2; font-size: 13px; }
		#maps-list {
			flex: 1; overflow-y: auto; padding: 10px 18px; min-height: 100px;
		}
		#maps-list .group-header {
			color: #c8d8f1; font-size: 12px; text-transform: uppercase;
			letter-spacing: 0.5px; margin: 10px 0 6px;
		}
		#maps-list .group-header:first-child { margin-top: 0; }
		#maps-list .row-item {
			display: flex; align-items: center; justify-content: space-between;
			gap: 8px; padding: 6px 10px; border-radius: 3px; background: #20293c;
			margin-bottom: 3px; font-size: 13px;
		}
		#maps-list .name { color: #ddd; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		#maps-list .path { color: #6a7a93; font-size: 11px; margin-left: 8px; }
		#maps-list button {
			background: #5a2828; padding: 4px 10px; font-size: 12px; line-height: 1;
		}
		#maps-list .empty { color: #777; text-align: center; padding: 30px 10px; }
		#maps-error { color: #f66; font-size: 13px; padding: 0 18px 14px; }

		#version {
			position: fixed; bottom: 8px; right: 12px;
			color: #888; font-size: 11px; letter-spacing: 0.3px;
			user-select: none;
			z-index: 50;
			cursor: pointer;
			text-decoration: underline dotted #555;
			text-underline-offset: 3px;
		}
		#version:hover { color: #c8d8f1; }

		#changelog-modal {
			position: fixed; inset: 0; z-index: 150;
			background: rgba(0, 0, 0, 0.75);
			display: none; align-items: center; justify-content: center;
			padding: 24px;
		}
		.changelog-panel {
			background: #1a2233; border: 1px solid #2a3a52; border-radius: 6px;
			width: 100%; max-width: 720px; max-height: 100%;
			display: flex; flex-direction: column;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
		}
		.changelog-header {
			display: flex; align-items: center; justify-content: space-between;
			padding: 14px 18px; border-bottom: 1px solid #2a3a52;
		}
		.changelog-title { font-size: 16px; font-weight: 500; }
		.changelog-body {
			flex: 1; overflow-y: auto; padding: 16px 22px; line-height: 1.55;
			color: #cfd8e6; font-size: 14px;
		}
		.changelog-body h1 { font-size: 18px; color: #eee; margin: 0 0 12px; }
		.changelog-body h2 { font-size: 15px; color: #c8d8f1; margin: 18px 0 6px; }
		.changelog-body p  { margin: 0 0 10px; color: #aab2c2; }
		.changelog-body ul { margin: 0 0 14px; padding-left: 22px; }
		.changelog-body li { margin: 3px 0; }
		.changelog-body code {
			background: #283146; color: #d8e8ff; padding: 1px 5px;
			border-radius: 3px; font-size: 12px;
		}

		#splash {
			position: fixed; inset: 0; z-index: 200;
			display: none;
			flex-direction: column; align-items: center; justify-content: center;
			gap: 24px;
			background: #000;
		}
		#splash img {
			max-width: 60vw; max-height: 60vh;
			object-fit: contain;
			image-rendering: -webkit-optimize-contrast;
			user-select: none; -webkit-user-drag: none;
		}
		#splash .label {
			color: #c8d8f1; font-size: 16px; letter-spacing: 0.5px;
			font-family: system-ui, -apple-system, sans-serif;
		}
		/* Animated ellipsis appended after "Initializing". 3-step keyframe so the
		   dots cycle through 1 → 2 → 3 → 1 on a 1.2 s loop. */
		#splash .label::after {
			content: '';
			display: inline-block;
			width: 1.5em;
			text-align: left;
			animation: splash-dots 1.2s steps(4, end) infinite;
		}
		@keyframes splash-dots {
			0%   { content: ''; }
			25%  { content: '.'; }
			50%  { content: '..'; }
			75%  { content: '...'; }
			100% { content: ''; }
		}
	</style>
</head>
<body oncontextmenu="return false">
	<div id="overlay">
		<h1>Warsmash (web)</h1>
		<p>To boot the engine the browser needs your Warcraft III install staged in private browser storage (OPFS).
			Pick your Warcraft III folder once — after that, the cached install is reused on every visit.</p>
		<div class="row">
			<button id="resume-btn" style="display:none">Play game</button>
			<label class="fakebtn" for="dir-input">Select Warcraft III folder</label>
			<input id="dir-input" type="file" webkitdirectory multiple style="display:none">
			<button id="manage-maps-btn" class="secondary" style="display:none">Manage maps</button>
		</div>
		<div id="progress"><div id="progress-bar"></div></div>
		<div id="summary"></div>
		<div id="status"></div>
		<div id="error"></div>
	</div>

	<div id="maps-modal" style="display:none">
		<div class="maps-panel">
			<div class="maps-header">
				<div class="maps-title">Manage maps</div>
				<button id="maps-close-btn" class="secondary">Close</button>
			</div>
			<div class="maps-actions">
				<label class="fakebtn" for="add-maps-input">Add maps</label>
				<input id="add-maps-input" type="file" accept=".w3x,.w3m" multiple style="display:none">
				<span id="maps-info"></span>
			</div>
			<div id="maps-list"></div>
			<div id="maps-error"></div>
		</div>
	</div>

	<div id="canvas-wrap"><canvas id="canvas"></canvas></div>

	<!-- Splash shown from "Play game" click until the engine-worker reports
	     setScreen(WarsmashGdxMenuScreen) — bridges the few seconds of black
	     screen during worker boot, MPQ open, GameUI/MenuUI construction. -->
	<div id="splash">
		<img id="splash-img" alt="">
		<div class="label">Initializing</div>
	</div>

	<div id="version" title="View changelog"></div>

	<!-- Multiplayer lobby overlay: appears in the bottom-right once the
	     engine has booted and WebMultiplayerCoordinator has bound the
	     warsmash* lobby functions to the global. Pure DOM — does not
	     interact with the libGDX canvas. Hidden by default; the engine
	     boot path reveals it once the coordinator is live. -->
	<div id="mp-overlay" style="position: fixed; right: 12px; bottom: 12px; z-index: 100;
	     background: rgba(20,30,45,0.92); border: 1px solid #4a5366; border-radius: 6px;
	     padding: 10px 12px; font-family: system-ui, sans-serif; font-size: 12px;
	     color: #d8dde6; max-width: 320px;">
		<div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
			<strong style="color:#ffd66b;">Multiplayer</strong>
			<span id="mp-self" style="color:#888; font-family: ui-monospace, Menlo, monospace; font-size: 10px;">—</span>
			<button id="mp-toggle" style="margin-left:auto; background:transparent; border:1px solid #4a5366;
			     color:#aaa; padding:2px 6px; border-radius:3px; cursor:pointer; font-size:11px;">hide</button>
		</div>
		<div id="mp-body">
			<div style="margin-bottom:6px;">
				<button id="mp-host" style="background:#2a4a7a; color:white; border:none;
				     padding:5px 10px; border-radius:3px; cursor:pointer; font-size:11px;">Host new lobby</button>
				or
				<input type="text" id="mp-join-code" placeholder="lobby code" maxlength="20"
				     style="background:#11141a; color:#d8dde6; border:1px solid #4a5366;
				     padding:4px 6px; border-radius:3px; font-size:11px; width:8em;">
				<button id="mp-join" style="background:#2a4a7a; color:white; border:none;
				     padding:5px 10px; border-radius:3px; cursor:pointer; font-size:11px;">Join</button>
				<button id="mp-leave" disabled style="background:#5a3a3a; color:white; border:none;
				     padding:5px 10px; border-radius:3px; cursor:pointer; font-size:11px; opacity:0.5;">Leave</button>
			</div>
			<div style="margin-bottom:6px; display:flex; align-items:center; gap:4px;">
				<input type="text" id="mp-map-path" value="Maps/FrozenThrone/(2)EchoIsles.w3x"
				     style="background:#11141a; color:#d8dde6; border:1px solid #4a5366;
				     padding:4px 6px; border-radius:3px; font-size:11px; flex:1;">
				<button id="mp-start" disabled style="background:#3a6a3a; color:white; border:none;
				     padding:5px 10px; border-radius:3px; cursor:pointer; font-size:11px; opacity:0.5;">Start Game</button>
			</div>
			<div id="mp-state" style="color:#aac; font-family: ui-monospace, Menlo, monospace; font-size: 11px;">not in lobby</div>
			<div id="mp-peers" style="color:#cdd; font-family: ui-monospace, Menlo, monospace; font-size: 11px; margin-top:4px;"></div>
			<div id="mp-status" style="color:#ffd66b; font-family: ui-monospace, Menlo, monospace; font-size: 11px; margin-top:4px;"></div>
			<div id="mp-events" style="color:#888; font-family: ui-monospace, Menlo, monospace; font-size: 10px;
			     margin-top:6px; max-height: 8em; overflow-y: auto;"></div>
		</div>
	</div>

	<div id="changelog-modal">
		<div class="changelog-panel">
			<div class="changelog-header">
				<div class="changelog-title">Changelog</div>
				<button id="changelog-close-btn" class="secondary">Close</button>
			</div>
			<div id="changelog-body" class="changelog-body">Loading…</div>
		</div>
	</div>

	<!-- Poki Netlib bridge: parcel-bundled (web-src/poki-bridge.ts +
	     @poki/netlib). Loads before the boot script so the engine's
	     `pokiBridge*` globals are available the moment any Java code
	     reaches PokiNetlibBridge.init(). Pure side-effect — assigns
	     pokiBridgeInit / pokiBridgeCreateLobby / etc. to the global. -->
	<script src="poki-bridge.js"></script>

	<!-- Multiplayer DOM overlay wiring. The lobby UI runs ENTIRELY on the
	     main thread using poki-bridge.js's globals directly, because the
	     engine itself runs in a Web Worker (engine-worker.js) which has its
	     own `self` global — anything the engine binds via @JSBody isn't
	     visible from this DOM context. Game-start (Start Game button) sends
	     a postMessage to the worker once we're ready to actually launch
	     into the map.
	     The pre-game lobby (host/join/peer events) is therefore independent
	     of engine boot — works immediately when the page loads. -->
	<script>
	(function () {
		// Stable UUID — must match WarsmashWebGameId.UUID on the Java side
		// so the JS-driven lobby and the engine's understanding of "which
		// game id is this" don't drift.
		var WARSMASH_GAME_ID = 'a664aaff-9291-4c9c-9f26-47b56eb7914a';
		var overlay = document.getElementById('mp-overlay');
		var toggleBtn = document.getElementById('mp-toggle');
		var hostBtn = document.getElementById('mp-host');
		var joinBtn = document.getElementById('mp-join');
		var leaveBtn = document.getElementById('mp-leave');
		var joinCodeEl = document.getElementById('mp-join-code');
		var stateEl = document.getElementById('mp-state');
		var peersEl = document.getElementById('mp-peers');
		var eventsEl = document.getElementById('mp-events');
		var bodyEl = document.getElementById('mp-body');
		var selfEl = document.getElementById('mp-self');
		var startBtn = document.getElementById('mp-start');
		var mapPathEl = document.getElementById('mp-map-path');
		var statusEl = document.getElementById('mp-status');
		var peers = new Set();
		var weAreHost = false;

		function logEvent(text, color) {
			var d = document.createElement('div');
			d.textContent = '[' + new Date().toISOString().slice(11, 19) + '] ' + text;
			if (color) d.style.color = color;
			eventsEl.appendChild(d);
			eventsEl.scrollTop = eventsEl.scrollHeight;
		}

		function refreshPeers() {
			if (peers.size === 0) { peersEl.textContent = 'no peers'; }
			else {
				peersEl.innerHTML = 'peers: ';
				peers.forEach(function (p) {
					var s = document.createElement('span');
					s.textContent = p;
					s.style.cssText = 'background:#2a4a7a; padding:1px 5px; margin-right:4px; border-radius:3px;';
					peersEl.appendChild(s);
				});
			}
			refreshStartButton();
		}

		function refreshStartButton() {
			// Start enabled when we're host AND at least one peer is connected.
			var canStart = weAreHost && peers.size > 0;
			startBtn.disabled = !canStart;
			startBtn.style.opacity = canStart ? '1' : '0.5';
		}

		toggleBtn.onclick = function () {
			var hidden = bodyEl.style.display === 'none';
			bodyEl.style.display = hidden ? '' : 'none';
			toggleBtn.textContent = hidden ? 'hide' : 'show';
		};

		// Initial state: buttons disabled, awaiting the Java coordinator.
		// The coordinator only binds its globals during WebWarsmashGame.create(),
		// which runs after the user has uploaded their W3 folder and clicked
		// "Play game". Show "waiting for engine…" until that happens so the
		// overlay isn't a dead UI element that confuses people pre-boot.
		hostBtn.disabled = true; hostBtn.style.opacity = '0.5';
		joinBtn.disabled = true; joinBtn.style.opacity = '0.5';
		statusEl.textContent = 'waiting for engine boot…';

		hostBtn.onclick = function () {
			if (typeof self.pokiBridgeCreateLobby !== 'function') {
				logEvent('netlib bridge not loaded', '#f88'); return;
			}
			hostBtn.disabled = true; joinBtn.disabled = true;
			self.pokiBridgeCreateLobby(function (code) {
				weAreHost = true;
				refreshStartButton();
				logEvent('hosting ' + code, '#8c8');
			}, function (reason) {
				logEvent('host failed: ' + reason, '#f88');
				hostBtn.disabled = false; joinBtn.disabled = false;
			});
		};

		startBtn.onclick = function () {
			var mapPath = mapPathEl.value.trim();
			if (!mapPath) { logEvent('enter a map path first', '#f88'); return; }
			startBtn.disabled = true; startBtn.style.opacity = '0.5';
			logEvent('starting game with map ' + mapPath, '#8c8');
			// TODO: postMessage to engine-worker to actually start. The
			// pre-engine-boot lobby works without it, but the game-start
			// path needs the worker-side WarsmashServer/Client construction.
			logEvent('Start Game wiring TBD — see WebMultiplayerCoordinator postMessage bridge', '#ffd66b');
		};

		joinBtn.onclick = function () {
			var code = joinCodeEl.value.trim();
			if (!code) { logEvent('enter a code', '#f88'); return; }
			if (typeof self.pokiBridgeJoinLobby !== 'function') {
				logEvent('netlib bridge not loaded', '#f88'); return;
			}
			hostBtn.disabled = true; joinBtn.disabled = true;
			self.pokiBridgeJoinLobby(code, function (joinedCode) {
				logEvent('joined ' + joinedCode, '#8c8');
			}, function (reason) {
				logEvent('join failed: ' + reason, '#f88');
				hostBtn.disabled = false; joinBtn.disabled = false;
			});
		};

		leaveBtn.onclick = function () {
			if (typeof self.pokiBridgeLeaveLobby !== 'function') return;
			self.pokiBridgeLeaveLobby();
		};

		// Initialise the netlib bridge directly on the main thread once
		// poki-bridge.js has loaded. The script tag for it sits above this
		// one, so by the time this IIFE runs it's already evaluated and
		// pokiBridgeInit is on `self` (== window here).
		function initBridge () {
			if (typeof self.pokiBridgeInit !== 'function') {
				logEvent('FATAL: pokiBridgeInit not found — poki-bridge.js failed to load', '#f88');
				statusEl.textContent = 'bridge missing';
				return;
			}
			var ok = self.pokiBridgeInit(WARSMASH_GAME_ID, {
				ready: function (selfId) {
					selfEl.textContent = selfId;
					statusEl.textContent = 'ready';
					hostBtn.disabled = false; hostBtn.style.opacity = '1';
					joinBtn.disabled = false; joinBtn.style.opacity = '1';
					logEvent('netlib ready, self id: ' + selfId, '#8c8');
				},
				lobby: function (code) {
					// Render as a click-to-copy chip rather than plain text.
					// Easier than reaching for the keyboard while you're
					// switching to the joiner tab.
					stateEl.innerHTML = '';
					var prefix = document.createTextNode('lobby: ');
					var chip = document.createElement('span');
					chip.textContent = code;
					chip.title = 'Click to copy';
					chip.style.cssText = 'cursor:pointer; padding:1px 6px; background:#2a4a7a; '
						+ 'color:#ffd66b; border-radius:3px; font-weight:bold; '
						+ 'letter-spacing:0.05em; user-select:all;';
					chip.onclick = function () {
						var done = function () {
							var prev = chip.textContent;
							chip.textContent = 'copied!';
							chip.style.background = '#3a6a3a';
							setTimeout(function () {
								chip.textContent = prev;
								chip.style.background = '#2a4a7a';
							}, 900);
						};
						// navigator.clipboard requires a secure context (https
						// or localhost). Fall back to a hidden-textarea copy
						// for the rare case where it's not available.
						if (navigator.clipboard && navigator.clipboard.writeText) {
							navigator.clipboard.writeText(code).then(done, function (err) {
								logEvent('clipboard write failed: ' + err, '#f88');
							});
						} else {
							var ta = document.createElement('textarea');
							ta.value = code;
							ta.style.cssText = 'position:fixed; opacity:0;';
							document.body.appendChild(ta);
							ta.select();
							try { document.execCommand('copy'); done(); }
							catch (e) { logEvent('copy failed: ' + e, '#f88'); }
							finally { document.body.removeChild(ta); }
						}
					};
					stateEl.appendChild(prefix);
					stateEl.appendChild(chip);
					leaveBtn.disabled = false; leaveBtn.style.opacity = '1';
				},
				left: function () {
					stateEl.textContent = 'not in lobby';
					peers.clear(); refreshPeers();
					weAreHost = false; refreshStartButton();
					hostBtn.disabled = false; joinBtn.disabled = false;
					leaveBtn.disabled = true; leaveBtn.style.opacity = '0.5';
				},
				peerConnected: function (peerId) {
					peers.add(peerId); refreshPeers();
					logEvent('peer connected: ' + peerId, '#8c8');
				},
				peerDisconnected: function (peerId, reason) {
					peers.delete(peerId); refreshPeers();
					logEvent('peer disconnected: ' + peerId + ' (' + reason + ')', '#f88');
				},
				leader: function (id) {
					logEvent('leader is now ' + id, '#aac');
				},
				message: function (peerId, channel, bytesU8, isString, stringValue) {
					// Pre-game lobby control messages and any chatter ride
					// the reliable channel; engine traffic lands on
					// unreliable. We don't dispatch engine traffic here yet
					// (TODO: postMessage to the engine-worker).
					if (isString) {
						logEvent('msg ' + peerId + ' [' + channel + '] "' + stringValue + '"');
					} else {
						logEvent('msg ' + peerId + ' [' + channel + '] bytes(' + bytesU8.byteLength + ')');
					}
				},
				error: function (kind, message) {
					logEvent(kind + ': ' + message, '#f88');
				}
			});
			if (!ok) {
				logEvent('pokiBridgeInit returned false — netlib library load issue?', '#f88');
				statusEl.textContent = 'init failed';
				return;
			}
			statusEl.textContent = 'connecting to signaling…';
			logEvent('bridge initialised, awaiting netlib ready event');
		}
		initBridge();
	})();
	</script>

	<script>
		const READY_KEY = 'w3AssetsReady';
		const COUNT_KEY = 'w3AssetsCount';
		const INDEX_KEY = 'w3AssetsIndex';
		const ROOT_DIR = 'w3';
		const CUSTOM_MAP_PREFIX = 'Maps/Upload/';
		const BUILD_ID = String(Date.now());
		// Bump on user-visible releases. Mirror the entry in html/CHANGELOG.md.
		const VERSION = '0.1.2';

		const el = (id) => document.getElementById(id);
		const setStatus = (m) => { el('status').textContent = m; };
		const setError = (m) => { el('error').textContent = m; };
		const setSummary = (m) => { el('summary').textContent = m; };
		let uploadSessionDirty = false;
		let engineStarted = false;

		// --- Screen wake lock --------------------------------------------------
		// Hold the screen awake during MPQ extraction and engine boot. Mobile
		// browsers throttle background tabs hard: workers stall, OPFS writes
		// drop to ~1 Hz, and the user comes back to a frozen page. Wake lock
		// keeps the page foreground+active while the heavy work runs. Browsers
		// without the API (older iOS) silently no-op.
		let wakeLock = null;
		async function acquireWakeLock() {
			if (wakeLock || !('wakeLock' in navigator)) return;
			try {
				wakeLock = await navigator.wakeLock.request('screen');
				wakeLock.addEventListener('release', () => { wakeLock = null; });
			}
			catch (_) {
				// Permission denied / page not visible; ignore — the user can
				// just keep the screen on manually.
			}
		}
		document.addEventListener('visibilitychange', () => {
			// Browsers auto-release the wake lock when the tab is hidden. When
			// the user comes back during a still-active session, re-acquire.
			if (document.visibilityState === 'visible' && (uploadSessionDirty || engineStarted)) {
				acquireWakeLock();
			}
		});

		async function getW3Root(create = false) {
			const root = await navigator.storage.getDirectory();
			return await root.getDirectoryHandle(ROOT_DIR, { create });
		}

		async function ensureDir(parent, parts) {
			let dir = parent;
			for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
			return dir;
		}

		async function clearOpfs() {
			const root = await navigator.storage.getDirectory();
			for (const name of ['w3', 'extracted']) {
				try { await root.removeEntry(name, { recursive: true }); }
				catch (e) { /* may not exist */ }
			}
			localStorage.removeItem(READY_KEY);
			localStorage.removeItem(COUNT_KEY);
			localStorage.removeItem(INDEX_KEY);
		}

		// User-uploaded maps live under /extracted/Maps/Upload/; the engine's
		// User-uploaded maps live under /w3/Maps/Upload/. The engine-worker
		// walks /w3/Maps/ at boot and pre-loads every .w3x/.w3m file (both
		// stock-from-install and uploaded). The Manage Maps panel shows
		// everything under /w3/Maps/.
		const UPLOAD_DIR_PARTS = ['Maps', 'Upload'];

		async function getMapsHostRoot(create = false) {
			const root = await navigator.storage.getDirectory();
			return await root.getDirectoryHandle('w3', { create });
		}

		async function getDirByParts(parts, create = false) {
			let dir = await getMapsHostRoot(create);
			for (const p of parts) {
				dir = await dir.getDirectoryHandle(p, { create });
			}
			return dir;
		}

		async function listAllMaps() {
			let mapsRoot;
			try {
				mapsRoot = await getDirByParts(['Maps'], false);
			}
			catch (e) {
				return [];
			}
			const out = [];
			async function walk(dir, parts) {
				for await (const [name, handle] of dir.entries()) {
					if (handle.kind === 'directory') {
						await walk(handle, parts.concat(name));
					}
					else {
						const lower = name.toLowerCase();
						if (lower.endsWith('.w3x') || lower.endsWith('.w3m')) {
							const isUpload = parts[0] === UPLOAD_DIR_PARTS[1];
							out.push({
								name,
								dirParts: parts,
								// path relative to /extracted/Maps/, with forward slashes
								relPath: parts.concat(name).join('/'),
								isUpload,
							});
						}
					}
				}
			}
			await walk(mapsRoot, []);
			out.sort((a, b) => {
				// Uploaded maps first, then alphabetical by relative path.
				if (a.isUpload !== b.isUpload) return a.isUpload ? -1 : 1;
				return a.relPath.localeCompare(b.relPath);
			});
			return out;
		}

		async function addUploadedMaps(files) {
			const dir = await getDirByParts(['Maps'].concat(UPLOAD_DIR_PARTS.slice(1)), true);
			let written = 0;
			for (const f of files) {
				const lower = f.name.toLowerCase();
				if (!lower.endsWith('.w3x') && !lower.endsWith('.w3m')) continue;
				const safe = sanitizeFileName(f.name);
				const handle = await dir.getFileHandle(safe, { create: true });
				const writable = await handle.createWritable();
				await writable.write(f);
				await writable.close();
				written++;
			}
			return written;
		}

		async function removeMapByEntry(entry) {
			const dir = await getDirByParts(['Maps'].concat(entry.dirParts), false);
			await dir.removeEntry(entry.name);
		}

		function setMapsError(m) {
			el('maps-error').textContent = m || '';
		}

		function escapeHtml(s) {
			return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
		}

		async function renderMapList() {
			const container = el('maps-list');
			setMapsError('');
			let entries;
			try {
				entries = await listAllMaps();
			}
			catch (err) {
				setMapsError('Failed to list maps: ' + (err && err.message ? err.message : err));
				container.innerHTML = '';
				el('maps-info').textContent = '';
				return;
			}
			el('maps-info').textContent = entries.length
				? `${entries.length} map${entries.length === 1 ? '' : 's'}`
				: '';
			if (!entries.length) {
				container.innerHTML = '<div class="empty">No maps found in /extracted/Maps/.</div>';
				return;
			}
			const uploaded = entries.filter(e => e.isUpload);
			const stock = entries.filter(e => !e.isUpload);
			const sectionFor = (label, items) => {
				if (!items.length) return '';
				const header = `<div class="group-header">${escapeHtml(label)} (${items.length})</div>`;
				const rows = items.map((entry, i) => {
					const idx = entries.indexOf(entry);
					const subdir = entry.dirParts.length ? entry.dirParts.join('/') + '/' : '';
					return `<div class="row-item">`
						+ `<span class="name">${escapeHtml(entry.name)}`
						+ `<span class="path">${escapeHtml(subdir)}</span></span>`
						+ `<button data-idx="${idx}">Remove</button>`
						+ `</div>`;
				}).join('');
				return header + rows;
			};
			container.innerHTML = sectionFor('Uploaded', uploaded) + sectionFor('Stock', stock);
			for (const btn of container.querySelectorAll('button[data-idx]')) {
				btn.addEventListener('click', async () => {
					const entry = entries[Number(btn.getAttribute('data-idx'))];
					try {
						await removeMapByEntry(entry);
						await renderMapList();
					}
					catch (err) {
						setMapsError('Remove failed: ' + (err && err.message ? err.message : err));
					}
				});
			}
		}

		function openMapsModal() {
			el('maps-modal').style.display = '';
			renderMapList();
		}

		function closeMapsModal() {
			el('maps-modal').style.display = 'none';
			setMapsError('');
		}

		function readIndex() {
			try {
				return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]');
			}
			catch (e) {
				return [];
			}
		}

		function writeIndex(index) {
			if (index.length) {
				localStorage.setItem(READY_KEY, '1');
				localStorage.setItem(COUNT_KEY, String(index.length));
				localStorage.setItem(INDEX_KEY, JSON.stringify(index));
			}
			else {
				localStorage.removeItem(READY_KEY);
				localStorage.removeItem(COUNT_KEY);
				localStorage.removeItem(INDEX_KEY);
			}
		}

		function upsertIndexEntry(index, path, size) {
			for (let i = 0; i < index.length; i++) {
				if (index[i].p === path) {
					index[i].s = size;
					return;
				}
			}
			index.push({ p: path, s: size });
		}

		function summarizeIndex(index) {
			let totalBytes = 0;
			let mpqCount = 0;
			let mapCount = 0;
			for (const entry of index) {
				totalBytes += Number(entry.s || 0);
				const lower = String(entry.p || '').toLowerCase();
				if (lower.endsWith('.mpq')) mpqCount++;
				if (lower.endsWith('.w3x') || lower.endsWith('.w3m')) mapCount++;
			}
			return {
				fileCount: index.length,
				mpqCount,
				mapCount,
				totalBytes
			};
		}

		function formatSummary(summary) {
			const totalMb = (summary.totalBytes / 1048576).toFixed(1);
			return `${summary.fileCount} staged files, ${summary.mpqCount} MPQs, ${summary.mapCount} maps, ${totalMb} MB total.`;
		}

		function versionedAsset(path) {
			return `${path}?v=${encodeURIComponent(BUILD_ID)}`;
		}

		function refreshButtons(summary = summarizeIndex(readIndex())) {
			const hasAssets = localStorage.getItem(READY_KEY) === '1';
			const hasMap = summary.mapCount > 0;
			// Single "Play game" button covers both fresh-upload and cached-resume
			// flows now that there's no separate extraction step.
			el('resume-btn').style.display = (!engineStarted && hasAssets) ? '' : 'none';
			el('resume-btn').disabled = !hasMap;
			// Manage Maps only makes sense once the install is staged — the
			// engine reads /extracted/, which is populated by the MPQ
			// extraction worker.
			el('manage-maps-btn').style.display = (!engineStarted && hasAssets) ? '' : 'none';
			// When cached assets exist, "Play game" is the obvious primary action;
			// demote the folder-pick label to a secondary style so re-uploading the
			// install reads as a fallback rather than the headline action.
			const dirLabel = document.querySelector('label.fakebtn[for="dir-input"]');
			if (dirLabel) {
				dirLabel.classList.toggle('secondary', hasAssets && !uploadSessionDirty);
			}
		}

		function buildNextStep(summary) {
			if (summary.mapCount > 0) {
				return 'Press "Play game" to boot the engine.';
			}
			return 'No map files are staged yet. Re-select your Warcraft III folder so a stock map (e.g. Echo Isles) is included.';
		}

		function sanitizeFileName(name) {
			return String(name || '').replace(/[\\/]/g, '_');
		}

		function stagedPathForFile(file, mode) {
			if (mode === 'directory') {
				const rel = file.webkitRelativePath || file.name;
				const parts = rel.split('/').filter(Boolean);
				const relParts = (parts.length > 1) ? parts.slice(1) : parts;
				return relParts.join('/');
			}
			const fileName = sanitizeFileName(file.name);
			const lower = fileName.toLowerCase();
			if (lower.endsWith('.w3x') || lower.endsWith('.w3m')) {
				return CUSTOM_MAP_PREFIX + fileName;
			}
			return fileName;
		}

		async function stageFiles(files, options) {
			setError('');
			acquireWakeLock();
			el('progress').style.display = 'block';
			el('progress-bar').style.width = '0%';
			el('dir-input').disabled = true;
			el('resume-btn').disabled = true;
			const replacing = options.replaceExisting || !uploadSessionDirty;
			let success = false;

			try {
				if (replacing) {
					await clearOpfs();
				}
				const w3 = await getW3Root(true);
				const index = replacing ? [] : readIndex();

				const list = Array.from(files);
				let bytes = 0, totalBytes = 0;
				for (const f of list) totalBytes += f.size;
				let done = 0;
				const started = performance.now();

				for (const f of list) {
					const stagedPath = stagedPathForFile(f, options.mode);
					const relParts = stagedPath.split('/').filter(Boolean);
					const fileName = relParts[relParts.length - 1];
					const dir = await ensureDir(w3, relParts.slice(0, -1));
					const handle = await dir.getFileHandle(fileName, { create: true });
					const writable = await handle.createWritable();
					await writable.write(f);
					await writable.close();
					bytes += f.size;
					done++;
					upsertIndexEntry(index, relParts.join('/'), f.size);
					const pct = totalBytes ? (bytes / totalBytes) * 100 : 100;
					el('progress-bar').style.width = pct.toFixed(1) + '%';
					const mb = (bytes / 1048576).toFixed(1);
					const totalMb = (totalBytes / 1048576).toFixed(1);
					setStatus(`${done}/${list.length}  ${mb} / ${totalMb} MB  (${f.name})`);
				}
				const took = ((performance.now() - started) / 1000).toFixed(1);
				writeIndex(index);
				uploadSessionDirty = true;
				const summary = summarizeIndex(index);
				setSummary(formatSummary(summary));
				setStatus(`Staged ${list.length} files (${(totalBytes / 1048576).toFixed(1)} MB) in ${took}s. ${buildNextStep(summary)}`);
				success = true;
			}
			finally {
				if (!success && replacing) {
					uploadSessionDirty = false;
				}
				const summary = summarizeIndex(readIndex());
				setSummary(summary.fileCount ? formatSummary(summary) : '');
				refreshButtons(summary);
				el('dir-input').disabled = false;
			}
		}

		function startEngine() {
			engineStarted = true;
			acquireWakeLock();
			el('overlay').style.display = 'none';
			el('canvas-wrap').style.display = 'flex';
			showSplash();

			const canvas = el('canvas');
			if (typeof OffscreenCanvas === 'undefined' || typeof canvas.transferControlToOffscreen !== 'function') {
				setError('OffscreenCanvas is required but not supported by this browser.');
				return;
			}

			// Pre-size at native CSS pixels (no DPR upscaling). HiDPI back-buffer
			// rendering needs the engine's font generator to scale by dpr too —
			// without it, buttons go 2× but text stays 15px and looks tiny. The
			// engine-worker has a HiDpiWebGL30 wrapper ready to gate back on
			// once that font path lands.
			const cssW = canvas.clientWidth || window.innerWidth;
			const cssH = canvas.clientHeight || window.innerHeight;
			const offscreen = canvas.transferControlToOffscreen();
			offscreen.width = Math.max(1, Math.round(cssW));
			offscreen.height = Math.max(1, Math.round(cssH));

			// Howler runs on the main thread. Worker postMessages audio.create
			// (with bytes) and audio.play (by id); main builds Howl instances
			// and drives playback. Loaded BEFORE worker spawn so the audio
			// message handler is ready when the worker starts emitting events.
			loadHowlerOnce(() => bootEngineWorker(canvas, offscreen, cssW, cssH));
		}

		function bootEngineWorker(canvas, offscreen, cssW, cssH) {
			const worker = new Worker(versionedAsset('engine-worker-boot.js'));
			worker.addEventListener('message', (e) => {
				const m = e.data;
				if (m && typeof m === 'object' && typeof m.kind === 'string' && m.kind.indexOf('audio.') === 0) {
					handleAudioMessage(m);
				}
				else {
					console.log('[engine]', m);
					// First frame the user actually wants to see: the engine has
					// installed WarsmashGdxMenuScreen. Drop the splash so the
					// chains-drop intro is visible from frame 0.
					if (typeof m === 'string' && m.indexOf('setScreen(WarsmashGdxMenuScreen)') !== -1) {
						hideSplash();
					}
				}
			});
			worker.addEventListener('error', (e) => {
				console.error('[engine error]', e.message || '(no message)', e);
				setError('Engine worker error: ' + (e.message || '(no message)'));
			});

			worker.postMessage({
				kind: 'init',
				canvas: offscreen,
				cssWidth: cssW,
				cssHeight: cssH,
				dpr: 1,
			}, [offscreen]);

			// Input proxy. Same shape as phase1-spike — the engine-worker reads
			// these messages via its installed message handler and routes them
			// into WorkerInput, which fans out to libGDX InputProcessor.
			function relayPointer(name, e) {
				const rect = canvas.getBoundingClientRect();
				// Translate browser pointer button → libGDX Input.Buttons.
				// Browser:  0=LEFT, 1=MIDDLE, 2=RIGHT
				// libGDX:   0=LEFT, 1=RIGHT, 2=MIDDLE
				let btn;
				switch (e.button) {
					case 0:  btn = 0; break;  // LEFT
					case 1:  btn = 2; break;  // MIDDLE
					case 2:  btn = 1; break;  // RIGHT
					default: btn = e.button;
				}
				worker.postMessage({
					kind: 'pointer', name,
					x: Math.round(e.clientX - rect.left),
					y: Math.round(e.clientY - rect.top),
					button: btn,
				});
			}
			canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); relayPointer('down', e); });
			canvas.addEventListener('pointerup', e => relayPointer('up', e));
			canvas.addEventListener('pointermove', e => relayPointer('move', e));
			canvas.addEventListener('pointercancel', e => relayPointer('up', e));
			canvas.addEventListener('wheel', e => {
				worker.postMessage({ kind: 'scroll', dx: e.deltaX, dy: e.deltaY });
				e.preventDefault();
			}, { passive: false });
			window.addEventListener('keydown', e => {
				worker.postMessage({ kind: 'key', name: 'down', keycode: domKeyToGdx(e), ch: e.key.length === 1 ? e.key : '' });
			});
			window.addEventListener('keyup', e => {
				worker.postMessage({ kind: 'key', name: 'up', keycode: domKeyToGdx(e), ch: '' });
			});

			// Debounced window-resize → propagate to worker. The CSS rules
			// already reflow the canvas DOM box (it's a 4:3 cap on 100vw/100vh);
			// the worker needs to resize the OffscreenCanvas back buffer + tell
			// libGDX so the engine re-projects. Debounce because resize events
			// fire continuously while dragging — we only care about the final
			// size, and OffscreenCanvas resize triggers GL state churn.
			let resizeTimer = null;
			function postResize() {
				const cssW = canvas.clientWidth;
				const cssH = canvas.clientHeight;
				if (cssW <= 0 || cssH <= 0) return;
				worker.postMessage({
					kind: 'resize',
					cssWidth: cssW,
					cssHeight: cssH,
					pixelWidth: cssW,   // back buffer = CSS px (no DPR scaling, see init)
					pixelHeight: cssH,
				});
			}
			window.addEventListener('resize', () => {
				clearTimeout(resizeTimer);
				resizeTimer = setTimeout(postResize, 150);
			});
		}

		// ---- Changelog modal ----
		let changelogLoaded = null;
		function openChangelog() {
			el('changelog-modal').style.display = 'flex';
			if (!changelogLoaded) {
				changelogLoaded = fetch(versionedAsset('CHANGELOG.md'), { cache: 'no-store' })
					.then(r => r.ok ? r.text() : Promise.reject(r.status))
					.then(text => { el('changelog-body').innerHTML = renderChangelog(text); })
					.catch(err => { el('changelog-body').textContent = 'Failed to load changelog: ' + err; });
			}
		}
		function closeChangelog() { el('changelog-modal').style.display = 'none'; }

		// Tiny markdown converter — handles the subset CHANGELOG.md actually uses:
		// `#`/`##` headings, `-` list items (with multi-line wrapped continuations),
		// `**bold**`, `\`code\`` spans, blank-line paragraph breaks. Keeps us off
		// a full markdown library for one file.
		function renderChangelog(md) {
			const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
			// Bold first, then code (code spans are leaf — bold inside them stays literal).
			const inline = (s) => escape(s)
				.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
				.replace(/`([^`]+)`/g, '<code>$1</code>');
			const lines = md.split('\n');
			const out = [];
			let inList = false;
			const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };
			let i = 0;
			while (i < lines.length) {
				const line = lines[i].replace(/\s+$/, '');
				if (line.startsWith('# ')) {
					closeList();
					out.push('<h1>' + inline(line.slice(2)) + '</h1>');
					i++;
				}
				else if (line.startsWith('## ')) {
					closeList();
					out.push('<h2>' + inline(line.slice(3)) + '</h2>');
					i++;
				}
				else if (line.startsWith('- ')) {
					if (!inList) { out.push('<ul>'); inList = true; }
					let item = line.slice(2);
					i++;
					// Coalesce indented continuation lines into this list item, the
					// way real markdown treats wrapped bullets.
					while (i < lines.length) {
						const cont = lines[i];
						if (cont.length === 0) break;
						if (cont.startsWith('- ') || cont.startsWith('# ') || cont.startsWith('## ')) break;
						if (!(cont.startsWith(' ') || cont.startsWith('\t'))) break;
						item += ' ' + cont.replace(/^\s+/, '');
						i++;
					}
					out.push('<li>' + inline(item) + '</li>');
				}
				else if (line === '') {
					closeList();
					i++;
				}
				else {
					closeList();
					out.push('<p>' + inline(line) + '</p>');
					i++;
				}
			}
			closeList();
			return out.join('\n');
		}

		// ---- Splash overlay ----
		function showSplash() {
			const img = el('splash-img');
			// Cache-bust like other versioned assets so a build bump invalidates
			// any browser-cached splash.
			img.src = versionedAsset('goblin-tinker.webp');
			el('splash').style.display = 'flex';
		}
		function hideSplash() {
			el('splash').style.display = 'none';
		}

		// ---- Howler / audio bridge ----
		let howlerLoading = null;
		function loadHowlerOnce(then) {
			if (typeof Howl === 'function') { then(); return; }
			if (howlerLoading) { howlerLoading.then(then); return; }
			howlerLoading = new Promise((resolve) => {
				const s = document.createElement('script');
				s.src = versionedAsset('scripts/howler.js');
				s.onload = () => resolve();
				s.onerror = () => { console.warn('howler.js failed to load — audio disabled'); resolve(); };
				document.body.appendChild(s);
			});
			howlerLoading.then(then);
		}

		// id -> { howl, pendingPlays: [...] }
		const audioSounds = new Map();
		function handleAudioMessage(m) {
			if (typeof Howl !== 'function') return;
			if (m.kind === 'audio.create')      handleAudioCreate(m);
			else if (m.kind === 'audio.play')   handleAudioPlay(m);
			else if (m.kind === 'audio.stop')   handleAudioStop(m);
			else if (m.kind === 'audio.volume') handleAudioVolume(m);
			else if (m.kind === 'audio.loop')   handleAudioLoop(m);
		}
		function handleAudioCreate(m) {
			const blob = new Blob([m.bytes], { type: guessAudioMime(m.name) });
			const url = URL.createObjectURL(blob);
			const entry = { howl: null, pendingPlays: [] };
			audioSounds.set(m.id, entry);
			entry.howl = new Howl({
				src: [url],
				format: [guessAudioFormat(m.name)],
				loop: false,
				onload: () => {
					for (const p of entry.pendingPlays) playOnHowl(entry, p);
					entry.pendingPlays = [];
				},
				onloaderror: (_, err) => console.warn('howl load error', m.name, err),
			});
		}
		function handleAudioPlay(m) {
			const entry = audioSounds.get(m.id);
			if (!entry) return;
			if (entry.howl && entry.howl.state() === 'loaded') {
				playOnHowl(entry, m);
			}
			else {
				entry.pendingPlays.push(m);
			}
		}
		function playOnHowl(entry, m) {
			const id = entry.howl.play();
			if (m.vol != null) entry.howl.volume(m.vol, id);
			if (m.pitch && m.pitch !== 1) entry.howl.rate(m.pitch, id);
			if (m.pan != null) entry.howl.stereo(m.pan, id);
			if (m.loop) entry.howl.loop(true, id);
		}
		function handleAudioStop(m) {
			const entry = audioSounds.get(m.id);
			if (entry && entry.howl) entry.howl.stop();
		}
		function handleAudioVolume(m) {
			const entry = audioSounds.get(m.id);
			if (entry && entry.howl) entry.howl.volume(m.vol);
		}
		function handleAudioLoop(m) {
			const entry = audioSounds.get(m.id);
			if (entry && entry.howl) entry.howl.loop(!!m.loop);
		}
		function guessAudioMime(name) {
			const lower = String(name || '').toLowerCase();
			if (lower.endsWith('.mp3')) return 'audio/mpeg';
			if (lower.endsWith('.wav')) return 'audio/wav';
			if (lower.endsWith('.ogg')) return 'audio/ogg';
			return 'application/octet-stream';
		}
		function guessAudioFormat(name) {
			const lower = String(name || '').toLowerCase();
			if (lower.endsWith('.mp3')) return 'mp3';
			if (lower.endsWith('.wav')) return 'wav';
			if (lower.endsWith('.ogg')) return 'ogg';
			return 'mp3';
		}

		// Map a DOM KeyboardEvent to libGDX Input.Keys constants. Just enough
		// for menu/gameplay basics — full table can grow as needed.
		function domKeyToGdx(e) {
			if (e.code && e.code.startsWith('Key')) return 29 + (e.code.charCodeAt(3) - 65); // A=29
			if (e.code && e.code.startsWith('Digit')) return 7 + (e.code.charCodeAt(5) - 48);  // 0=7
			switch (e.code) {
				case 'Space': return 62;
				case 'Enter': return 66;
				case 'Escape': return 131;
				case 'ArrowLeft': return 21;
				case 'ArrowRight': return 22;
				case 'ArrowUp': return 19;
				case 'ArrowDown': return 20;
				case 'ShiftLeft': case 'ShiftRight': return 59;
				case 'ControlLeft': case 'ControlRight': return 129;
				case 'AltLeft': case 'AltRight': return 57;
				case 'Tab': return 61;
				case 'Backspace': return 67;
				default: return -1;
			}
		}

		// Async: recursively list OPFS /extracted. Returns newline-joined
		// forward-slash paths, or "" if /extracted doesn't exist.
		window.w3MainListExtractedAsync = async function() {
			const storage = await navigator.storage.getDirectory();
			let root;
			try { root = await storage.getDirectoryHandle('extracted'); }
			catch (e) { return ''; }
			const out = [];
			async function walk(dir, prefix) {
				for await (const [name, handle] of dir.entries()) {
					const p = prefix + name;
					if (handle.kind === 'directory') {
						await walk(handle, p + '/');
					}
					else {
						out.push(p);
					}
				}
			}
			await walk(root, '');
			return out.join('\n');
		};

		// Async: read a file under OPFS /extracted as Int8Array, null on miss.
		window.w3MainReadExtractedAsync = async function(relPath) {
			try {
				const storage = await navigator.storage.getDirectory();
				let dir = await storage.getDirectoryHandle('extracted');
				const parts = String(relPath).split('/').filter(Boolean);
				for (let i = 0; i < parts.length - 1; i++) {
					dir = await dir.getDirectoryHandle(parts[i]);
				}
				const fh = await dir.getFileHandle(parts[parts.length - 1]);
				const file = await fh.getFile();
				const ab = await file.arrayBuffer();
				return new Int8Array(ab);
			}
			catch (e) {
				return null;
			}
		};

		function spawnExtractionWorker() {
			try {
				const w = new Worker(versionedAsset('worker-boot.js'));
				w.addEventListener('message', (e) => {
					console.log('[worker]', e.data);
					window.__workerLog = (window.__workerLog || []);
					window.__workerLog.push(String(e.data));
				});
				w.addEventListener('error', (e) => {
					console.error('[worker error]', e.message, e);
					window.__workerLog = (window.__workerLog || []);
					window.__workerLog.push('ERROR: ' + e.message);
				});
			}
			catch (err) {
				console.error('worker spawn failed', err);
			}
		}

		function wireUI() {
			el('dir-input').addEventListener('change', (e) => {
				if (e.target.files && e.target.files.length) {
					stageFiles(e.target.files, { mode: 'directory', replaceExisting: true })
						.catch(err => setError(String(err)))
						.finally(() => { e.target.value = ''; });
				}
			});
			el('resume-btn').addEventListener('click', startEngine);
			el('manage-maps-btn').addEventListener('click', openMapsModal);
			el('maps-close-btn').addEventListener('click', closeMapsModal);
			el('maps-modal').addEventListener('click', (e) => {
				// Close when clicking the dark backdrop (but not the panel itself).
				if (e.target === el('maps-modal')) closeMapsModal();
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && el('maps-modal').style.display !== 'none') {
					closeMapsModal();
				}
			});
			el('add-maps-input').addEventListener('change', async (e) => {
				const files = Array.from(e.target.files || []);
				e.target.value = '';
				if (!files.length) return;
				setMapsError('');
				try {
					const written = await addUploadedMaps(files);
					if (!written) {
						setMapsError('No .w3x or .w3m files in selection.');
					}
					await renderMapList();
				}
				catch (err) {
					setMapsError('Add maps failed: ' + (err && err.message ? err.message : err));
				}
			});
		}

		// One-time legacy cleanup: the presence of OPFS /extracted/ marks an
		// install staged by the previous main-thread engine. Empirically the
		// old /w3 layout from that era doesn't always boot cleanly under the
		// engine-worker (esp. on iOS Safari). Safer to wipe everything and
		// have the user re-pick their Warcraft III folder once than to try to
		// migrate in place. Remove this block after a release or two once
		// most users have migrated.
		async function purgeLegacyState() {
			try {
				const root = await navigator.storage.getDirectory();
				let hasLegacy = false;
				try {
					await root.getDirectoryHandle('extracted');
					hasLegacy = true;
				}
				catch (e) { /* not present */ }
				if (!hasLegacy) return;
				setStatus('Old install detected — clearing cached files. You\'ll need to re-pick your Warcraft III folder once.');
				for (const name of ['extracted', 'w3']) {
					try { await root.removeEntry(name, { recursive: true }); }
					catch (e) { /* may not exist */ }
				}
				localStorage.removeItem(READY_KEY);
				localStorage.removeItem(COUNT_KEY);
				localStorage.removeItem(INDEX_KEY);
				setStatus('Cleared cached files. Pick your Warcraft III folder to continue.');
			}
			catch (e) {
				console.warn('legacy cleanup failed:', e);
			}
		}

		(async function init() {
			el('version').textContent = 'v' + VERSION;
			el('version').addEventListener('click', openChangelog);
			el('changelog-close-btn').addEventListener('click', closeChangelog);
			el('changelog-modal').addEventListener('click', (e) => {
				if (e.target === el('changelog-modal')) closeChangelog();
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && el('changelog-modal').style.display === 'flex') {
					closeChangelog();
				}
			});
			wireUI();
			if (!('storage' in navigator) || !navigator.storage.getDirectory) {
				setError('OPFS is not supported in this browser.');
				return;
			}
			await purgeLegacyState();
			if (localStorage.getItem(READY_KEY) === '1') {
				const index = readIndex();
				const summary = summarizeIndex(index);
				setSummary(formatSummary(summary));
				setStatus(`Found cached staged assets. ${buildNextStep(summary)}`);
				refreshButtons(summary);
				return;
			}
			refreshButtons();
		})();
	</script>
</body>
