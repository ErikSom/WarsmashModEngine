<!DOCTYPE html>
<html>
<head>
	<title>Warsmash</title>
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<style>
		:root { color-scheme: dark; }
		body {
			margin: 0; padding: 0; overflow: hidden;
			background: #000; color: #eee;
			font-family: system-ui, -apple-system, sans-serif;
			height: 100vh;
			height: 100dvh;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
		}
		#canvas-wrap {
			display: none;
			justify-content: center; align-items: center;
			height: 100vh;
			height: 100dvh;
			touch-action: none;
		}
		#canvas {
			border: none;
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}
		#overlay {
			position: fixed; inset: 0;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
			background: radial-gradient(ellipse at center, #1a2233 0%, #000 100%);
			gap: 18px;
		}
		#overlay h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: 0.5px; }
		#overlay p { margin: 0; max-width: 560px; text-align: center; color: #bbb; line-height: 1.5; }
		#overlay code { background: #222; padding: 2px 6px; border-radius: 3px; }
		.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
		button, label.fakebtn {
			background: #2a4a7a; color: white; border: none; padding: 10px 18px;
			border-radius: 4px; cursor: pointer; font-size: 14px;
		}
		button.secondary, label.fakebtn.secondary { background: #444; }
		button:hover, label.fakebtn:hover { filter: brightness(1.15); }
		button:disabled { opacity: 0.5; cursor: not-allowed; }
		#progress {
			display: none; width: 520px; max-width: 90vw;
			background: #222; border-radius: 4px; overflow: hidden; height: 10px;
		}
		#progress-bar { height: 100%; width: 0%; background: #4a90d9; transition: width 100ms; }
		#summary { color: #c8d8f1; font-size: 13px; text-align: center; max-width: 560px; line-height: 1.5; }
		#status { color: #999; font-size: 13px; min-height: 18px; text-align: center; max-width: 560px; }
		#error { color: #f66; font-size: 13px; text-align: center; max-width: 560px; }
		#maps-modal {
			position: fixed; inset: 0; z-index: 100;
			background: rgba(0, 0, 0, 0.75);
			display: flex; align-items: center; justify-content: center;
			padding: 24px;
		}
		.maps-panel {
			background: #1a2233; border: 1px solid #2a3a52; border-radius: 6px;
			width: 100%; max-width: 720px; max-height: 100%;
			display: flex; flex-direction: column;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
		}
		.maps-header {
			display: flex; align-items: center; justify-content: space-between;
			padding: 14px 18px; border-bottom: 1px solid #2a3a52;
		}
		.maps-title { font-size: 16px; font-weight: 500; }
		.maps-actions {
			display: flex; align-items: center; gap: 12px;
			padding: 12px 18px; border-bottom: 1px solid #2a3a52;
		}
		#maps-info { color: #99a8c2; font-size: 13px; }
		#maps-list {
			flex: 1; overflow-y: auto; padding: 10px 18px; min-height: 100px;
		}
		#maps-list .group-header {
			color: #c8d8f1; font-size: 12px; text-transform: uppercase;
			letter-spacing: 0.5px; margin: 10px 0 6px;
		}
		#maps-list .group-header:first-child { margin-top: 0; }
		#maps-list .row-item {
			display: flex; align-items: center; justify-content: space-between;
			gap: 8px; padding: 6px 10px; border-radius: 3px; background: #20293c;
			margin-bottom: 3px; font-size: 13px;
		}
		#maps-list .name { color: #ddd; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		#maps-list .path { color: #6a7a93; font-size: 11px; margin-left: 8px; }
		#maps-list button {
			background: #5a2828; padding: 4px 10px; font-size: 12px; line-height: 1;
		}
		#maps-list .empty { color: #777; text-align: center; padding: 30px 10px; }
		#maps-error { color: #f66; font-size: 13px; padding: 0 18px 14px; }
	</style>
</head>
<body oncontextmenu="return false">
	<div id="overlay">
		<h1>Warsmash (web)</h1>
		<p>To boot the engine the browser needs your Warcraft III install staged in private browser storage (OPFS).
			Pick your Warcraft III folder once — after that, the cached install is reused on every visit.</p>
		<div class="row">
			<button id="resume-btn" style="display:none">Play game</button>
			<label class="fakebtn" for="dir-input">Select Warcraft III folder</label>
			<input id="dir-input" type="file" webkitdirectory multiple style="display:none">
			<button id="start-btn" style="display:none">Start extraction and engine</button>
			<button id="manage-maps-btn" class="secondary" style="display:none">Manage maps</button>
			<button id="reset-btn" class="secondary" style="display:none">Clear cached assets</button>
		</div>
		<div id="progress"><div id="progress-bar"></div></div>
		<div id="summary"></div>
		<div id="status"></div>
		<div id="error"></div>
	</div>

	<div id="maps-modal" style="display:none">
		<div class="maps-panel">
			<div class="maps-header">
				<div class="maps-title">Manage maps</div>
				<button id="maps-close-btn" class="secondary">Close</button>
			</div>
			<div class="maps-actions">
				<label class="fakebtn" for="add-maps-input">Add maps</label>
				<input id="add-maps-input" type="file" accept=".w3x,.w3m" multiple style="display:none">
				<span id="maps-info"></span>
			</div>
			<div id="maps-list"></div>
			<div id="maps-error"></div>
		</div>
	</div>

	<div id="canvas-wrap"><canvas id="canvas"></canvas></div>

	<script>
		const READY_KEY = 'w3AssetsReady';
		const COUNT_KEY = 'w3AssetsCount';
		const INDEX_KEY = 'w3AssetsIndex';
		const ROOT_DIR = 'w3';
		const CUSTOM_MAP_PREFIX = 'Maps/Upload/';
		const BUILD_ID = String(Date.now());

		const el = (id) => document.getElementById(id);
		const setStatus = (m) => { el('status').textContent = m; };
		const setError = (m) => { el('error').textContent = m; };
		const setSummary = (m) => { el('summary').textContent = m; };
		let uploadSessionDirty = false;
		let engineStarted = false;

		// --- Screen wake lock --------------------------------------------------
		// Hold the screen awake during MPQ extraction and engine boot. Mobile
		// browsers throttle background tabs hard: workers stall, OPFS writes
		// drop to ~1 Hz, and the user comes back to a frozen page. Wake lock
		// keeps the page foreground+active while the heavy work runs. Browsers
		// without the API (older iOS) silently no-op.
		let wakeLock = null;
		async function acquireWakeLock() {
			if (wakeLock || !('wakeLock' in navigator)) return;
			try {
				wakeLock = await navigator.wakeLock.request('screen');
				wakeLock.addEventListener('release', () => { wakeLock = null; });
			}
			catch (_) {
				// Permission denied / page not visible; ignore — the user can
				// just keep the screen on manually.
			}
		}
		document.addEventListener('visibilitychange', () => {
			// Browsers auto-release the wake lock when the tab is hidden. When
			// the user comes back during a still-active session, re-acquire.
			if (document.visibilityState === 'visible' && (uploadSessionDirty || engineStarted)) {
				acquireWakeLock();
			}
		});

		async function getW3Root(create = false) {
			const root = await navigator.storage.getDirectory();
			return await root.getDirectoryHandle(ROOT_DIR, { create });
		}

		async function ensureDir(parent, parts) {
			let dir = parent;
			for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
			return dir;
		}

		async function clearOpfs() {
			const root = await navigator.storage.getDirectory();
			for (const name of ['w3', 'extracted']) {
				try { await root.removeEntry(name, { recursive: true }); }
				catch (e) { /* may not exist */ }
			}
			localStorage.removeItem(READY_KEY);
			localStorage.removeItem(COUNT_KEY);
			localStorage.removeItem(INDEX_KEY);
		}

		// User-uploaded maps live under /extracted/Maps/Upload/; the engine's
		// WebMapBootScreen enumerates /extracted/ recursively for *.w3x/*.w3m.
		// "Stock" maps come from the MPQ extraction worker and live under other
		// subdirectories of /extracted/Maps/ (FrozenThrone, etc.). The Manage
		// Maps panel walks /extracted/Maps/ recursively, so it shows every map
		// the engine would find, not just the user-added ones.
		const UPLOAD_DIR_PARTS = ['Maps', 'Upload'];

		async function getExtractedRoot(create = false) {
			const root = await navigator.storage.getDirectory();
			return await root.getDirectoryHandle('extracted', { create });
		}

		async function getDirByParts(parts, create = false) {
			let dir = await getExtractedRoot(create);
			for (const p of parts) {
				dir = await dir.getDirectoryHandle(p, { create });
			}
			return dir;
		}

		async function listAllMaps() {
			let mapsRoot;
			try {
				mapsRoot = await getDirByParts(['Maps'], false);
			}
			catch (e) {
				return [];
			}
			const out = [];
			async function walk(dir, parts) {
				for await (const [name, handle] of dir.entries()) {
					if (handle.kind === 'directory') {
						await walk(handle, parts.concat(name));
					}
					else {
						const lower = name.toLowerCase();
						if (lower.endsWith('.w3x') || lower.endsWith('.w3m')) {
							const isUpload = parts[0] === UPLOAD_DIR_PARTS[1];
							out.push({
								name,
								dirParts: parts,
								// path relative to /extracted/Maps/, with forward slashes
								relPath: parts.concat(name).join('/'),
								isUpload,
							});
						}
					}
				}
			}
			await walk(mapsRoot, []);
			out.sort((a, b) => {
				// Uploaded maps first, then alphabetical by relative path.
				if (a.isUpload !== b.isUpload) return a.isUpload ? -1 : 1;
				return a.relPath.localeCompare(b.relPath);
			});
			return out;
		}

		async function addUploadedMaps(files) {
			const dir = await getDirByParts(['Maps'].concat(UPLOAD_DIR_PARTS.slice(1)), true);
			let written = 0;
			for (const f of files) {
				const lower = f.name.toLowerCase();
				if (!lower.endsWith('.w3x') && !lower.endsWith('.w3m')) continue;
				const safe = sanitizeFileName(f.name);
				const handle = await dir.getFileHandle(safe, { create: true });
				const writable = await handle.createWritable();
				await writable.write(f);
				await writable.close();
				written++;
			}
			return written;
		}

		async function removeMapByEntry(entry) {
			const dir = await getDirByParts(['Maps'].concat(entry.dirParts), false);
			await dir.removeEntry(entry.name);
		}

		function setMapsError(m) {
			el('maps-error').textContent = m || '';
		}

		function escapeHtml(s) {
			return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
		}

		async function renderMapList() {
			const container = el('maps-list');
			setMapsError('');
			let entries;
			try {
				entries = await listAllMaps();
			}
			catch (err) {
				setMapsError('Failed to list maps: ' + (err && err.message ? err.message : err));
				container.innerHTML = '';
				el('maps-info').textContent = '';
				return;
			}
			el('maps-info').textContent = entries.length
				? `${entries.length} map${entries.length === 1 ? '' : 's'}`
				: '';
			if (!entries.length) {
				container.innerHTML = '<div class="empty">No maps found in /extracted/Maps/.</div>';
				return;
			}
			const uploaded = entries.filter(e => e.isUpload);
			const stock = entries.filter(e => !e.isUpload);
			const sectionFor = (label, items) => {
				if (!items.length) return '';
				const header = `<div class="group-header">${escapeHtml(label)} (${items.length})</div>`;
				const rows = items.map((entry, i) => {
					const idx = entries.indexOf(entry);
					const subdir = entry.dirParts.length ? entry.dirParts.join('/') + '/' : '';
					return `<div class="row-item">`
						+ `<span class="name">${escapeHtml(entry.name)}`
						+ `<span class="path">${escapeHtml(subdir)}</span></span>`
						+ `<button data-idx="${idx}">Remove</button>`
						+ `</div>`;
				}).join('');
				return header + rows;
			};
			container.innerHTML = sectionFor('Uploaded', uploaded) + sectionFor('Stock', stock);
			for (const btn of container.querySelectorAll('button[data-idx]')) {
				btn.addEventListener('click', async () => {
					const entry = entries[Number(btn.getAttribute('data-idx'))];
					try {
						await removeMapByEntry(entry);
						await renderMapList();
					}
					catch (err) {
						setMapsError('Remove failed: ' + (err && err.message ? err.message : err));
					}
				});
			}
		}

		function openMapsModal() {
			el('maps-modal').style.display = '';
			renderMapList();
		}

		function closeMapsModal() {
			el('maps-modal').style.display = 'none';
			setMapsError('');
		}

		function readIndex() {
			try {
				return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]');
			}
			catch (e) {
				return [];
			}
		}

		function writeIndex(index) {
			if (index.length) {
				localStorage.setItem(READY_KEY, '1');
				localStorage.setItem(COUNT_KEY, String(index.length));
				localStorage.setItem(INDEX_KEY, JSON.stringify(index));
			}
			else {
				localStorage.removeItem(READY_KEY);
				localStorage.removeItem(COUNT_KEY);
				localStorage.removeItem(INDEX_KEY);
			}
		}

		function upsertIndexEntry(index, path, size) {
			for (let i = 0; i < index.length; i++) {
				if (index[i].p === path) {
					index[i].s = size;
					return;
				}
			}
			index.push({ p: path, s: size });
		}

		function summarizeIndex(index) {
			let totalBytes = 0;
			let mpqCount = 0;
			let mapCount = 0;
			for (const entry of index) {
				totalBytes += Number(entry.s || 0);
				const lower = String(entry.p || '').toLowerCase();
				if (lower.endsWith('.mpq')) mpqCount++;
				if (lower.endsWith('.w3x') || lower.endsWith('.w3m')) mapCount++;
			}
			return {
				fileCount: index.length,
				mpqCount,
				mapCount,
				totalBytes
			};
		}

		function formatSummary(summary) {
			const totalMb = (summary.totalBytes / 1048576).toFixed(1);
			return `${summary.fileCount} staged files, ${summary.mpqCount} MPQs, ${summary.mapCount} maps, ${totalMb} MB total.`;
		}

		function versionedAsset(path) {
			return `${path}?v=${encodeURIComponent(BUILD_ID)}`;
		}

		function refreshButtons(summary = summarizeIndex(readIndex())) {
			const hasAssets = localStorage.getItem(READY_KEY) === '1';
			const hasMap = summary.mapCount > 0;
			el('start-btn').style.display = (!engineStarted && uploadSessionDirty && hasAssets) ? '' : 'none';
			el('start-btn').disabled = !hasMap;
			el('resume-btn').style.display = (!engineStarted && !uploadSessionDirty && hasAssets) ? '' : 'none';
			el('resume-btn').disabled = !hasMap;
			el('reset-btn').style.display = hasAssets ? '' : 'none';
			// Manage Maps only makes sense once the install is staged — the
			// engine reads /extracted/, which is populated by the MPQ
			// extraction worker.
			el('manage-maps-btn').style.display = (!engineStarted && hasAssets) ? '' : 'none';
			// When cached assets exist, "Play game" is the obvious primary action;
			// demote the folder-pick label to a secondary style so re-uploading the
			// install reads as a fallback rather than the headline action.
			const dirLabel = document.querySelector('label.fakebtn[for="dir-input"]');
			if (dirLabel) {
				dirLabel.classList.toggle('secondary', hasAssets && !uploadSessionDirty);
			}
		}

		function buildNextStep(summary) {
			if (summary.mapCount > 0) {
				return 'Press "Play game" to boot the engine.';
			}
			return 'No map files are staged yet. Re-select your Warcraft III folder so a stock map (e.g. Echo Isles) is included.';
		}

		function sanitizeFileName(name) {
			return String(name || '').replace(/[\\/]/g, '_');
		}

		function stagedPathForFile(file, mode) {
			if (mode === 'directory') {
				const rel = file.webkitRelativePath || file.name;
				const parts = rel.split('/').filter(Boolean);
				const relParts = (parts.length > 1) ? parts.slice(1) : parts;
				return relParts.join('/');
			}
			const fileName = sanitizeFileName(file.name);
			const lower = fileName.toLowerCase();
			if (lower.endsWith('.w3x') || lower.endsWith('.w3m')) {
				return CUSTOM_MAP_PREFIX + fileName;
			}
			return fileName;
		}

		async function stageFiles(files, options) {
			setError('');
			acquireWakeLock();
			el('progress').style.display = 'block';
			el('progress-bar').style.width = '0%';
			el('dir-input').disabled = true;
			el('start-btn').disabled = true;
			el('resume-btn').disabled = true;
			el('reset-btn').disabled = true;
			const replacing = options.replaceExisting || !uploadSessionDirty;
			let success = false;

			try {
				if (replacing) {
					await clearOpfs();
				}
				const w3 = await getW3Root(true);
				const index = replacing ? [] : readIndex();

				const list = Array.from(files);
				let bytes = 0, totalBytes = 0;
				for (const f of list) totalBytes += f.size;
				let done = 0;
				const started = performance.now();

				for (const f of list) {
					const stagedPath = stagedPathForFile(f, options.mode);
					const relParts = stagedPath.split('/').filter(Boolean);
					const fileName = relParts[relParts.length - 1];
					const dir = await ensureDir(w3, relParts.slice(0, -1));
					const handle = await dir.getFileHandle(fileName, { create: true });
					const writable = await handle.createWritable();
					await writable.write(f);
					await writable.close();
					bytes += f.size;
					done++;
					upsertIndexEntry(index, relParts.join('/'), f.size);
					const pct = totalBytes ? (bytes / totalBytes) * 100 : 100;
					el('progress-bar').style.width = pct.toFixed(1) + '%';
					const mb = (bytes / 1048576).toFixed(1);
					const totalMb = (totalBytes / 1048576).toFixed(1);
					setStatus(`${done}/${list.length}  ${mb} / ${totalMb} MB  (${f.name})`);
				}
				const took = ((performance.now() - started) / 1000).toFixed(1);
				writeIndex(index);
				uploadSessionDirty = true;
				const summary = summarizeIndex(index);
				setSummary(formatSummary(summary));
				setStatus(`Staged ${list.length} files (${(totalBytes / 1048576).toFixed(1)} MB) in ${took}s. ${buildNextStep(summary)}`);
				success = true;
			}
			finally {
				if (!success && replacing) {
					uploadSessionDirty = false;
				}
				const summary = summarizeIndex(readIndex());
				setSummary(summary.fileCount ? formatSummary(summary) : '');
				refreshButtons(summary);
				el('dir-input').disabled = false;
				el('reset-btn').disabled = false;
			}
		}

		function startEngine() {
			engineStarted = true;
			acquireWakeLock();
			el('overlay').style.display = 'none';
			el('canvas-wrap').style.display = 'flex';
			spawnExtractionWorker();
			// jpeg-js decodes WC3's 4-channel JPEG BLPs preserving their BGRA alpha
			// component, which the browser's native createImageBitmap/canvas path
			// silently discards. BrowserImageBridge.decodeJpegBlpMipToRgba calls into
			// this; it must be loaded before app.js runs.
			const jpeg = document.createElement('script');
			jpeg.src = versionedAsset('scripts/jpeg-js.js');
			jpeg.charset = 'utf-8';
			jpeg.onload = () => {
				const s = document.createElement('script');
				s.src = versionedAsset('app.js');
				s.charset = 'utf-8';
				s.onload = () => { if (typeof main === 'function') main(); };
				document.body.appendChild(s);
			};
			document.body.appendChild(jpeg);
		}

		// Async: recursively list OPFS /extracted. Returns newline-joined
		// forward-slash paths, or "" if /extracted doesn't exist.
		window.w3MainListExtractedAsync = async function() {
			const storage = await navigator.storage.getDirectory();
			let root;
			try { root = await storage.getDirectoryHandle('extracted'); }
			catch (e) { return ''; }
			const out = [];
			async function walk(dir, prefix) {
				for await (const [name, handle] of dir.entries()) {
					const p = prefix + name;
					if (handle.kind === 'directory') {
						await walk(handle, p + '/');
					}
					else {
						out.push(p);
					}
				}
			}
			await walk(root, '');
			return out.join('\n');
		};

		// Async: read a file under OPFS /extracted as Int8Array, null on miss.
		window.w3MainReadExtractedAsync = async function(relPath) {
			try {
				const storage = await navigator.storage.getDirectory();
				let dir = await storage.getDirectoryHandle('extracted');
				const parts = String(relPath).split('/').filter(Boolean);
				for (let i = 0; i < parts.length - 1; i++) {
					dir = await dir.getDirectoryHandle(parts[i]);
				}
				const fh = await dir.getFileHandle(parts[parts.length - 1]);
				const file = await fh.getFile();
				const ab = await file.arrayBuffer();
				return new Int8Array(ab);
			}
			catch (e) {
				return null;
			}
		};

		function spawnExtractionWorker() {
			try {
				const w = new Worker(versionedAsset('worker-boot.js'));
				w.addEventListener('message', (e) => {
					console.log('[worker]', e.data);
					window.__workerLog = (window.__workerLog || []);
					window.__workerLog.push(String(e.data));
				});
				w.addEventListener('error', (e) => {
					console.error('[worker error]', e.message, e);
					window.__workerLog = (window.__workerLog || []);
					window.__workerLog.push('ERROR: ' + e.message);
				});
			}
			catch (err) {
				console.error('worker spawn failed', err);
			}
		}

		function wireUI() {
			el('dir-input').addEventListener('change', (e) => {
				if (e.target.files && e.target.files.length) {
					stageFiles(e.target.files, { mode: 'directory', replaceExisting: true })
						.catch(err => setError(String(err)))
						.finally(() => { e.target.value = ''; });
				}
			});
			el('start-btn').addEventListener('click', startEngine);
			el('resume-btn').addEventListener('click', startEngine);
			el('reset-btn').addEventListener('click', async () => {
				await clearOpfs();
				uploadSessionDirty = false;
				location.reload();
			});
			el('manage-maps-btn').addEventListener('click', openMapsModal);
			el('maps-close-btn').addEventListener('click', closeMapsModal);
			el('maps-modal').addEventListener('click', (e) => {
				// Close when clicking the dark backdrop (but not the panel itself).
				if (e.target === el('maps-modal')) closeMapsModal();
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && el('maps-modal').style.display !== 'none') {
					closeMapsModal();
				}
			});
			el('add-maps-input').addEventListener('change', async (e) => {
				const files = Array.from(e.target.files || []);
				e.target.value = '';
				if (!files.length) return;
				setMapsError('');
				try {
					const written = await addUploadedMaps(files);
					if (!written) {
						setMapsError('No .w3x or .w3m files in selection.');
					}
					await renderMapList();
				}
				catch (err) {
					setMapsError('Add maps failed: ' + (err && err.message ? err.message : err));
				}
			});
		}

		(async function init() {
			wireUI();
			if (!('storage' in navigator) || !navigator.storage.getDirectory) {
				setError('OPFS is not supported in this browser.');
				return;
			}
			if (localStorage.getItem(READY_KEY) === '1') {
				const index = readIndex();
				const summary = summarizeIndex(index);
				setSummary(formatSummary(summary));
				setStatus(`Found cached staged assets. ${buildNextStep(summary)}`);
				refreshButtons(summary);
				return;
			}
			refreshButtons();
		})();
	</script>
</body>
</html>
