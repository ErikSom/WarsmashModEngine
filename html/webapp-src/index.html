<!DOCTYPE html>
<html>
<head>
	<title>Warsmash</title>
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<style>
		:root { color-scheme: dark; }
		body {
			margin: 0; padding: 0; overflow: hidden;
			background: #000; color: #eee;
			font-family: system-ui, -apple-system, sans-serif;
			height: 100vh;
			height: 100dvh;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
		}
		#canvas-wrap {
			display: none;
			justify-content: center; align-items: center;
			height: 100vh;
			height: 100dvh;
			touch-action: none;
		}
		#canvas {
			border: none;
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}
		#overlay {
			position: fixed; inset: 0;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
			background: radial-gradient(ellipse at center, #1a2233 0%, #000 100%);
			gap: 18px;
		}
		#overlay h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: 0.5px; }
		#overlay p { margin: 0; max-width: 560px; text-align: center; color: #bbb; line-height: 1.5; }
		#overlay code { background: #222; padding: 2px 6px; border-radius: 3px; }
		.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
		button, label.fakebtn {
			background: #2a4a7a; color: white; border: none; padding: 10px 18px;
			border-radius: 4px; cursor: pointer; font-size: 14px;
		}
		button.secondary, label.fakebtn.secondary { background: #444; }
		button:hover, label.fakebtn:hover { filter: brightness(1.15); }
		button:disabled { opacity: 0.5; cursor: not-allowed; }
		#progress {
			display: none; width: 520px; max-width: 90vw;
			background: #222; border-radius: 4px; overflow: hidden; height: 10px;
		}
		#progress-bar { height: 100%; width: 0%; background: #4a90d9; transition: width 100ms; }
		#summary { color: #c8d8f1; font-size: 13px; text-align: center; max-width: 560px; line-height: 1.5; }
		#status { color: #999; font-size: 13px; min-height: 18px; text-align: center; max-width: 560px; }
		#error { color: #f66; font-size: 13px; text-align: center; max-width: 560px; }
	</style>
</head>
<body oncontextmenu="return false">
	<div id="overlay">
		<h1>Warsmash (web)</h1>
		<p>To boot the engine the browser needs Warcraft III data in private browser storage (OPFS).
			On desktop you can stage the whole install folder. For the MPQ-first path you can also stage the core
			<code>.mpq</code> files plus a <code>.w3x</code> or <code>.w3m</code> map.</p>
		<div class="row">
			<label class="fakebtn" for="dir-input">Select Warcraft III folder</label>
			<input id="dir-input" type="file" webkitdirectory multiple style="display:none">
			<label class="fakebtn secondary" for="file-input">Select MPQs / maps</label>
			<input id="file-input" type="file" accept=".mpq,.w3x,.w3m" multiple style="display:none">
			<button id="start-btn" style="display:none">Start extraction and engine</button>
			<button id="resume-btn" class="secondary" style="display:none">Resume with cached assets</button>
			<button id="reset-btn" class="secondary" style="display:none">Clear cached assets</button>
		</div>
		<div id="progress"><div id="progress-bar"></div></div>
		<div id="summary"></div>
		<div id="status"></div>
		<div id="error"></div>
	</div>

	<div id="canvas-wrap"><canvas id="canvas"></canvas></div>

	<script>
		const READY_KEY = 'w3AssetsReady';
		const COUNT_KEY = 'w3AssetsCount';
		const INDEX_KEY = 'w3AssetsIndex';
		const ROOT_DIR = 'w3';
		const CUSTOM_MAP_PREFIX = 'Maps/Upload/';
		const BUILD_ID = String(Date.now());

		const el = (id) => document.getElementById(id);
		const setStatus = (m) => { el('status').textContent = m; };
		const setError = (m) => { el('error').textContent = m; };
		const setSummary = (m) => { el('summary').textContent = m; };
		let uploadSessionDirty = false;
		let engineStarted = false;

		async function getW3Root(create = false) {
			const root = await navigator.storage.getDirectory();
			return await root.getDirectoryHandle(ROOT_DIR, { create });
		}

		async function ensureDir(parent, parts) {
			let dir = parent;
			for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
			return dir;
		}

		async function clearOpfs() {
			const root = await navigator.storage.getDirectory();
			for (const name of ['w3', 'extracted']) {
				try { await root.removeEntry(name, { recursive: true }); }
				catch (e) { /* may not exist */ }
			}
			localStorage.removeItem(READY_KEY);
			localStorage.removeItem(COUNT_KEY);
			localStorage.removeItem(INDEX_KEY);
		}

		function readIndex() {
			try {
				return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]');
			}
			catch (e) {
				return [];
			}
		}

		function writeIndex(index) {
			if (index.length) {
				localStorage.setItem(READY_KEY, '1');
				localStorage.setItem(COUNT_KEY, String(index.length));
				localStorage.setItem(INDEX_KEY, JSON.stringify(index));
			}
			else {
				localStorage.removeItem(READY_KEY);
				localStorage.removeItem(COUNT_KEY);
				localStorage.removeItem(INDEX_KEY);
			}
		}

		function upsertIndexEntry(index, path, size) {
			for (let i = 0; i < index.length; i++) {
				if (index[i].p === path) {
					index[i].s = size;
					return;
				}
			}
			index.push({ p: path, s: size });
		}

		function summarizeIndex(index) {
			let totalBytes = 0;
			let mpqCount = 0;
			let mapCount = 0;
			for (const entry of index) {
				totalBytes += Number(entry.s || 0);
				const lower = String(entry.p || '').toLowerCase();
				if (lower.endsWith('.mpq')) mpqCount++;
				if (lower.endsWith('.w3x') || lower.endsWith('.w3m')) mapCount++;
			}
			return {
				fileCount: index.length,
				mpqCount,
				mapCount,
				totalBytes
			};
		}

		function formatSummary(summary) {
			const totalMb = (summary.totalBytes / 1048576).toFixed(1);
			return `${summary.fileCount} staged files, ${summary.mpqCount} MPQs, ${summary.mapCount} maps, ${totalMb} MB total.`;
		}

		function versionedAsset(path) {
			return `${path}?v=${encodeURIComponent(BUILD_ID)}`;
		}

		function refreshButtons(summary = summarizeIndex(readIndex())) {
			const hasAssets = localStorage.getItem(READY_KEY) === '1';
			const hasMap = summary.mapCount > 0;
			el('start-btn').style.display = (!engineStarted && uploadSessionDirty && hasAssets) ? '' : 'none';
			el('start-btn').disabled = !hasMap;
			el('resume-btn').style.display = (!engineStarted && !uploadSessionDirty && hasAssets) ? '' : 'none';
			el('resume-btn').disabled = !hasMap;
			el('reset-btn').style.display = hasAssets ? '' : 'none';
		}

		function buildNextStep(summary) {
			if (summary.mapCount > 0) {
				return 'Press "Start extraction and engine" to extract and boot.';
			}
			return 'No map files are staged yet. Use the full install folder for stock maps, or add a .w3x/.w3m file before starting.';
		}

		function sanitizeFileName(name) {
			return String(name || '').replace(/[\\/]/g, '_');
		}

		function stagedPathForFile(file, mode) {
			if (mode === 'directory') {
				const rel = file.webkitRelativePath || file.name;
				const parts = rel.split('/').filter(Boolean);
				const relParts = (parts.length > 1) ? parts.slice(1) : parts;
				return relParts.join('/');
			}
			const fileName = sanitizeFileName(file.name);
			const lower = fileName.toLowerCase();
			if (lower.endsWith('.w3x') || lower.endsWith('.w3m')) {
				return CUSTOM_MAP_PREFIX + fileName;
			}
			return fileName;
		}

		async function stageFiles(files, options) {
			setError('');
			el('progress').style.display = 'block';
			el('progress-bar').style.width = '0%';
			el('dir-input').disabled = true;
			el('file-input').disabled = true;
			el('start-btn').disabled = true;
			el('resume-btn').disabled = true;
			el('reset-btn').disabled = true;
			const replacing = options.replaceExisting || !uploadSessionDirty;
			let success = false;

			try {
				if (replacing) {
					await clearOpfs();
				}
				const w3 = await getW3Root(true);
				const index = replacing ? [] : readIndex();

				const list = Array.from(files);
				let bytes = 0, totalBytes = 0;
				for (const f of list) totalBytes += f.size;
				let done = 0;
				const started = performance.now();

				for (const f of list) {
					const stagedPath = stagedPathForFile(f, options.mode);
					const relParts = stagedPath.split('/').filter(Boolean);
					const fileName = relParts[relParts.length - 1];
					const dir = await ensureDir(w3, relParts.slice(0, -1));
					const handle = await dir.getFileHandle(fileName, { create: true });
					const writable = await handle.createWritable();
					await writable.write(f);
					await writable.close();
					bytes += f.size;
					done++;
					upsertIndexEntry(index, relParts.join('/'), f.size);
					const pct = totalBytes ? (bytes / totalBytes) * 100 : 100;
					el('progress-bar').style.width = pct.toFixed(1) + '%';
					const mb = (bytes / 1048576).toFixed(1);
					const totalMb = (totalBytes / 1048576).toFixed(1);
					setStatus(`${done}/${list.length}  ${mb} / ${totalMb} MB  (${f.name})`);
				}
				const took = ((performance.now() - started) / 1000).toFixed(1);
				writeIndex(index);
				uploadSessionDirty = true;
				const summary = summarizeIndex(index);
				setSummary(formatSummary(summary));
				setStatus(`Staged ${list.length} files (${(totalBytes / 1048576).toFixed(1)} MB) in ${took}s. ${buildNextStep(summary)}`);
				success = true;
			}
			finally {
				if (!success && replacing) {
					uploadSessionDirty = false;
				}
				const summary = summarizeIndex(readIndex());
				setSummary(summary.fileCount ? formatSummary(summary) : '');
				refreshButtons(summary);
				el('dir-input').disabled = false;
				el('file-input').disabled = false;
				el('reset-btn').disabled = false;
			}
		}

		function startEngine() {
			engineStarted = true;
			el('overlay').style.display = 'none';
			el('canvas-wrap').style.display = 'flex';
			spawnExtractionWorker();
			// jpeg-js decodes WC3's 4-channel JPEG BLPs preserving their BGRA alpha
			// component, which the browser's native createImageBitmap/canvas path
			// silently discards. BrowserImageBridge.decodeJpegBlpMipToRgba calls into
			// this; it must be loaded before app.js runs.
			const jpeg = document.createElement('script');
			jpeg.src = versionedAsset('scripts/jpeg-js.js');
			jpeg.charset = 'utf-8';
			jpeg.onload = () => {
				const s = document.createElement('script');
				s.src = versionedAsset('app.js');
				s.charset = 'utf-8';
				s.onload = () => { if (typeof main === 'function') main(); };
				document.body.appendChild(s);
			};
			document.body.appendChild(jpeg);
		}

		// Async: recursively list OPFS /extracted. Returns newline-joined
		// forward-slash paths, or "" if /extracted doesn't exist.
		window.w3MainListExtractedAsync = async function() {
			const storage = await navigator.storage.getDirectory();
			let root;
			try { root = await storage.getDirectoryHandle('extracted'); }
			catch (e) { return ''; }
			const out = [];
			async function walk(dir, prefix) {
				for await (const [name, handle] of dir.entries()) {
					const p = prefix + name;
					if (handle.kind === 'directory') {
						await walk(handle, p + '/');
					}
					else {
						out.push(p);
					}
				}
			}
			await walk(root, '');
			return out.join('\n');
		};

		// Async: read a file under OPFS /extracted as Int8Array, null on miss.
		window.w3MainReadExtractedAsync = async function(relPath) {
			try {
				const storage = await navigator.storage.getDirectory();
				let dir = await storage.getDirectoryHandle('extracted');
				const parts = String(relPath).split('/').filter(Boolean);
				for (let i = 0; i < parts.length - 1; i++) {
					dir = await dir.getDirectoryHandle(parts[i]);
				}
				const fh = await dir.getFileHandle(parts[parts.length - 1]);
				const file = await fh.getFile();
				const ab = await file.arrayBuffer();
				return new Int8Array(ab);
			}
			catch (e) {
				return null;
			}
		};

		function spawnExtractionWorker() {
			try {
				const w = new Worker(versionedAsset('worker-boot.js'));
				w.addEventListener('message', (e) => {
					console.log('[worker]', e.data);
					window.__workerLog = (window.__workerLog || []);
					window.__workerLog.push(String(e.data));
				});
				w.addEventListener('error', (e) => {
					console.error('[worker error]', e.message, e);
					window.__workerLog = (window.__workerLog || []);
					window.__workerLog.push('ERROR: ' + e.message);
				});
			}
			catch (err) {
				console.error('worker spawn failed', err);
			}
		}

		function wireUI() {
			el('dir-input').addEventListener('change', (e) => {
				if (e.target.files && e.target.files.length) {
					stageFiles(e.target.files, { mode: 'directory', replaceExisting: true })
						.catch(err => setError(String(err)))
						.finally(() => { e.target.value = ''; });
				}
			});
			el('file-input').addEventListener('change', (e) => {
				if (e.target.files && e.target.files.length) {
					stageFiles(e.target.files, { mode: 'files', replaceExisting: !uploadSessionDirty })
						.catch(err => setError(String(err)))
						.finally(() => { e.target.value = ''; });
				}
			});
			el('start-btn').addEventListener('click', startEngine);
			el('resume-btn').addEventListener('click', startEngine);
			el('reset-btn').addEventListener('click', async () => {
				await clearOpfs();
				uploadSessionDirty = false;
				location.reload();
			});
		}

		(async function init() {
			wireUI();
			if (!('storage' in navigator) || !navigator.storage.getDirectory) {
				setError('OPFS is not supported in this browser.');
				return;
			}
			if (localStorage.getItem(READY_KEY) === '1') {
				const index = readIndex();
				const summary = summarizeIndex(index);
				setSummary(formatSummary(summary));
				setStatus(`Found cached staged assets. ${buildNextStep(summary)}`);
				refreshButtons(summary);
				return;
			}
			refreshButtons();
		})();
	</script>
</body>
</html>
