[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceCompatibility = 1.17

sourceSets.main.java.srcDirs = [ "src/" ]

ext.mainClassName = "com.etheller.warsmash.html.BuildTeaVMHtml"
ext.assetsDir = new File("../core/assets")

task buildWeb(dependsOn: classes, type: JavaExec) {
    mainClass = project.ext.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.projectDir
    ignoreExitValue = false
}

task buildWorker(dependsOn: classes, type: JavaExec) {
    mainClass = "com.etheller.warsmash.html.worker.BuildWorkerTeaVM"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.projectDir
    ignoreExitValue = false
}

task buildEngineWorker(dependsOn: classes, type: JavaExec) {
    mainClass = "com.etheller.warsmash.html.engineworker.BuildEngineWorkerTeaVM"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.projectDir
    ignoreExitValue = false
}

// Plain task (not type: Copy) so Gradle does NOT register
// build/dist/webapp as an exclusive managed output for this task.
// A `Copy` task auto-treats its `into` directory as its output dir and runs
// stale-output cleanup, which on a fresh build (Cloudflare Pages, or local
// `gradlew clean`) deletes the TeaVM-produced app.js and assets/ that
// :html:buildWeb just wrote. Locally this was masked by incremental
// up-to-date state keeping copyWebOverrides from running.
task copyWebOverrides {
    description = "Lay webapp-src + public overrides on top of the TeaVM build output."
    inputs.dir file("webapp-src")
    if (file("public").exists()) {
        inputs.dir file("public")
    }
    // No outputs.dir declared on purpose — see comment above.
    doLast {
        copy {
            from "webapp-src"
            into "build/dist/webapp"
        }
        // Static, hand-curated assets (splash images, favicons, etc.) — kept
        // separate from webapp-src so it's clear they aren't TeaVM-build output.
        if (file("public").exists()) {
            copy {
                from "public"
                into "build/dist/webapp"
            }
        }
    }
}

buildWeb.finalizedBy copyWebOverrides
buildWeb.finalizedBy buildWorker
buildWeb.finalizedBy buildEngineWorker

eclipse.project {
    name = appName + "-html"
}
