[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceCompatibility = 1.17

sourceSets.main.java.srcDirs = [ "src/" ]

ext.mainClassName = "com.etheller.warsmash.html.BuildTeaVMHtml"
ext.assetsDir = new File("../core/assets")

task buildWeb(dependsOn: classes, type: JavaExec) {
    mainClass = project.ext.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.projectDir
    ignoreExitValue = false
}

task buildWorker(dependsOn: classes, type: JavaExec) {
    mainClass = "com.etheller.warsmash.html.worker.BuildWorkerTeaVM"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.projectDir
    ignoreExitValue = false
}

task buildEngineWorker(dependsOn: classes, type: JavaExec) {
    mainClass = "com.etheller.warsmash.html.engineworker.BuildEngineWorkerTeaVM"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.projectDir
    ignoreExitValue = false
}

// Plain task (not type: Copy) so Gradle does NOT register
// build/dist/webapp as an exclusive managed output for this task.
// A `Copy` task auto-treats its `into` directory as its output dir and runs
// stale-output cleanup, which on a fresh build (Cloudflare Pages, or local
// `gradlew clean`) deletes the TeaVM-produced app.js and assets/ that
// :html:buildWeb just wrote. Locally this was masked by incremental
// up-to-date state keeping copyWebOverrides from running.
task copyWebOverrides {
    description = "Lay webapp-src + public overrides on top of the TeaVM build output."
    inputs.dir file("webapp-src")
    if (file("public").exists()) {
        inputs.dir file("public")
    }
    // No outputs.dir declared on purpose — see comment above.
    doLast {
        copy {
            from "webapp-src"
            into "build/dist/webapp"
        }
        // Static, hand-curated assets (splash images, favicons, etc.) — kept
        // separate from webapp-src so it's clear they aren't TeaVM-build output.
        if (file("public").exists()) {
            copy {
                from "public"
                into "build/dist/webapp"
            }
        }
    }
}

// Build the Astro+Preact public site from web-src/. This produces the
// landing page (index.html), the engine page (play/index.html), the
// multiplayer pages (multiplayer/index.html), plus all the Preact
// islands and the Poki Netlib bridge. Output lands in web-src/dist/
// which we then layer over build/dist/webapp/. Skipped if web-src/
// doesn't exist (so older clones without it still build).
//
// Astro replaces the previous parcel build — there's no longer a
// hand-written index.html in webapp-src/ that ships to prod. The
// worker bootstraps (engine-worker-boot.js, worker-boot.js) still
// live in webapp-src/ since they're not @poki/netlib-dependent and
// don't need a bundler; copyWebOverrides handles them.
task buildWebSrc {
    description = "Run Astro inside web-src/ to build the public site (landing, /play, /multiplayer) and bundle the Poki Netlib bridge."
    onlyIf { file("web-src/package.json").exists() }
    inputs.file file("web-src/package.json")
    inputs.file file("web-src/astro.config.mjs")
    inputs.file file("web-src/tsconfig.json")
    inputs.dir file("web-src/src")
    inputs.dir file("web-src/public")

    doLast {
        def workDir = file("web-src")
        if (!file("web-src/node_modules").exists()) {
            exec {
                workingDir workDir
                commandLine "npm", "install"
            }
        }
        exec {
            workingDir workDir
            commandLine "npm", "run", "build"
        }
        // Layer Astro's dist/ over the webapp output. Astro emits an
        // index.html that supersedes the legacy webapp-src/index.html
        // copied by copyWebOverrides — we depend on this task running
        // AFTER copyWebOverrides for the overwrite to be the one the
        // user sees in production. The TeaVM-built engine artefacts
        // (app.js, engine-worker.js, assets/, etc.) live alongside
        // Astro's pages and remain untouched.
        copy {
            from "web-src/dist"
            into "build/dist/webapp"
        }
    }
}

buildWeb.finalizedBy copyWebOverrides
buildWeb.finalizedBy buildWorker
buildWeb.finalizedBy buildEngineWorker
buildWeb.finalizedBy buildWebSrc
// Strict ordering: Astro's index.html / play/index.html / multiplayer/
// index.html must overwrite anything copyWebOverrides put down, so the
// site behaves consistently regardless of finalizer-add order.
buildWebSrc.mustRunAfter copyWebOverrides

eclipse.project {
    name = appName + "-html"
}
